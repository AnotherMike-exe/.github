name: Bug report
description: Something is broken or behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Questions belong in Discussions; security problems go through the Security tab.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag, or commit SHA.
      placeholder: v1.2.0 / latest / a0d9151
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run it?
      options:
        - Docker / Docker Compose
        - Unraid
        - Bare metal / from source
        - ESPHome firmware
        - Hardware / PCB
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and hardware
      description: OS, host, architecture, board or PCB revision, related services and their versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens, passwords, and personal data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest version.
          required: false
